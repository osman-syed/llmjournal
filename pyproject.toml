[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llmjournal"
version = "0.1.0"
description = "Record LLM calls, cost and payloads; shape them for your own database; render them as HTML. No server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Osman" }]
keywords = ["llm", "observability", "tracing", "cost", "tokens", "dynamodb", "postgres", "serverless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/osman-syed/llmjournal"
Source = "https://github.com/osman-syed/llmjournal"
Issues = "https://github.com/osman-syed/llmjournal/issues"
Changelog = "https://github.com/osman-syed/llmjournal/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]
integration = ["pytest>=8", "boto3>=1.34", "psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmjournal = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
